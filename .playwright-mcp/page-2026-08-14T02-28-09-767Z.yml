            - paragraph [ref=f1e202]: I build full-stack products and then put real AI inside them — semantic and vector search, streaming assistants grounded in live application data, and LLM endpoints with hard cost guardrails that degrade gracefully instead of falling over. Four years across e-commerce, healthcare, real estate, retail inventory and consulting SaaS, on a TypeScript/NestJS/Next.js core with Java Spring Boot on the backend side.
            - paragraph [ref=f1e203]: "I own things end to end: schema, API, UI, Docker image, Nginx config, and the deploy that puts it in front of users."
